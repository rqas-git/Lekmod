name: CI Pipeline

run-name: "CI: ${{ github.event_name != 'pull_request' && github.event.head_commit.message || github.event.pull_request.title }}"

on: 
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    name: Refactor and packaging checks
    strategy:
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python dependencies
        run: python -m pip install requests
      - name: Install native test dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang pkg-config lua5.1 liblua5.1-0-dev libsqlite3-dev
      - name: Verify UI packages, map output, bindings, and installer lifecycle
        env:
          CXX: clang++
        run: python -m unittest discover -s tests -v
      - name: Verify macOS installer filesystem behavior
        if: runner.os == 'Linux'
        run: python -m unittest discover -s macos/tests -v
      - name: Verify transactional Windows installer updates
        run: python -m unittest discover -s LekmodInstaller/tests -v
      - name: Install performance fixture dependencies
        if: runner.os == 'Linux'
        run: python -m pip install -r tests/performance/requirements.txt
      - name: Verify gameplay performance equivalence
        if: runner.os == 'Linux'
        run: python -B tests/performance/validate.py

  build:
    name: Build from source
    needs: checks
    strategy:
      matrix:
        config: [Debug, Release]
    env:
      vs_url: https://archive.org/download/vs-2008-express-w-sp-1/VS2008-Express-w-SP1.ISO
    runs-on: windows-2022
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          sparse-checkout: |
            LEKMOD/
            !LEKMOD/*.dll
            LEKMOD_DLL/
            LekmodInstaller/
            tools/
            tests/
            !**/BuildOutput/
            !**/BuildTemp/
          sparse-checkout-cone-mode: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache Visual Studio 2008 Installer
        id: cache-vs2008-install
        uses: actions/cache@v4
        with:
          path: vs2008
          key: ${{ runner.os }}-vs2008-install

      - name: Download Visual Studio 2008 Installer
        if: steps.cache-vs2008-install.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          choco install 7zip.install
          Invoke-WebRequest "$($Env:vs_url)" -OutFile vs2008.iso
          7z.exe x -y -o".\vs2008" vs2008.iso

      - name: Install Visual C++ 2008
        shell: pwsh
        run: |
          Start-Process -FilePath ".\vs2008\VCExpress\setup.exe" -ArgumentList "/q" -Wait
          Get-Content -Path "$([System.IO.Path]::GetTempPath())VSMsi*.txt" -ErrorAction SilentlyContinue

      - name: Build Project
        shell: pwsh
        run: |
          C:\Program` Files` `(x86`)\Microsoft` Visual` Studio` 9.0\VC\vcpackages\vcbuild.exe "LEKMOD_DLL\CvGameCoreDLL_Expansion2\CvGameCoreDLL_Expansion2.vcproj" ${{ matrix.config }}

      - name: Prepare Artifact
        if: ${{ github.event_name != 'pull_request' }}
        shell: pwsh
        run: |
          Copy-Item "LEKMOD_DLL\CvGameCoreDLL_Expansion2\BuildOutput\VS2008_${{ matrix.config }}Win32\CvGameCore_Expansion2.dll" -Destination LEKMOD
          if ("${{ matrix.config }}" -eq "Debug") {
            Copy-Item "LEKMOD_DLL\CvGameCoreDLL_Expansion2\BuildOutput\VS2008_${{ matrix.config }}Win32\CvGameCore_Expansion2.*" -Destination LEKMOD
          }
          python tools/package_lekmod.py --destination artifact/LEKMOD

      - name: Upload Artifact
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@v4
        with:
          name: Lekmod-CI-Win32-${{ matrix.config }}
          path: artifact
